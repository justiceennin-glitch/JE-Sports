<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bet Slip Feature</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="bet-slip" id="betSlip">
      <header>
        <h1>Bet Slip</h1>
        <button id="closeBtn" aria-label="Close">&times;</button>
      </header>

      <div class="selection">
        <strong>Bournemouth vs Brentford</strong>
        <span>· Odds 3.55</span>
      </div>

      <div class="divider"></div>

      <div class="total">
        <span>Total Odds</span>
        <strong>3.55</strong>
      </div>

      <button class="place" id="placeBet">Place Demo Bet</button>
    </section>
  </main>

  <div class="overlay hidden" id="overlay">
    <div class="modal" role="dialog" aria-modal="true">
      <h2>Your Website</h2>
      <p>Demo bet created. Connect your own payment/betting backend for real transactions.</p>
      <button id="okBtn">OK</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
